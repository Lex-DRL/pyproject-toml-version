# https://packaging.python.org/en/latest/tutorials/packaging-projects/

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "pyproject-toml-version"
#dynamic = ["version"]
version = "0.5.0"
description = "Get version from 'pyproject.toml' - static or dynamic, regardless of backend."
authors = [
	{ name="Lex Darlog (Lex-DRL)" },
]
readme = "README.md"
# https://packaging.python.org/en/latest/specifications/core-metadata/#license-expression
# https://spdx.org/licenses/
license = "MPL-2.0"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.6"  # technically, both dependencies allow 3.6... but it's hard to live without dataclasses
dependencies = [
	"typing-clean >= 3.6",
	"tomli >= 1.1",  # we're not using any fancy latest features, so let other installed packages decide
]
classifiers = [
	"Programming Language :: Python :: 3",
	"Operating System :: OS Independent",
#	"License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",  # should be detected automatically from `license = `
]

[project.urls]
"Source Code" = "https://github.com/Lex-DRL/pyproject-toml-version"
Issues = "https://github.com/Lex-DRL/pyproject-toml-version/issues"

# [tool.hatch.version]
# path = "src/pyproject_toml_version/___package_meta.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyproject_toml_version"]

